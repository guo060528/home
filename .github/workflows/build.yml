# 推送构建预览（构建产物通过 Actions artifact 的 zip 发布）
name: Build Dev

on:
  push:
    branches:
      - dev
      - master
  workflow_dispatch: # 允许在 GitHub 网页手动运行

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    name: Build Website
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 检出 Git 仓库
      - name: Check out git repository
        uses: actions/checkout@v4

      # 安装 Node.js
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: 'npm'

      # 确保存在 .env（缺失时从模板复制）
      - name: Ensure .env file
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      # 安装项目依赖
      - name: Install Dependencies
        run: npm ci

      # 构建程序
      - name: Build Website
        run: npm run build

      # 上传构建产物
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Home
          path: dist
